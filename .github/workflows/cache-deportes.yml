# Precalcula en `sports_cache` la tabla, el calendario y los próximos partidos
# de las 9 competiciones (migración 033, PRs #57-58). Sin esto, cada visita a
# la portada o a /liga/[slug] le pega a API-Football y un pico de tráfico se
# come la cuota diaria en minutos (incidente del 13-ago).
#
# Cada 10 min: son ~39 llamadas a API-Football por ejecución (~5.600/día),
# holgado dentro del plan Ultra (75.000/día). El marcador en vivo NO pasa por
# aquí — va aparte, en el workflow de ingesta.
name: Caché de deportes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: cache-deportes
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tocar /api/cron/refresh-sports-cache
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta el secreto CRON_SECRET en el repo (gh secret set CRON_SECRET)"
            exit 1
          fi

          code=$(curl -sS -o /tmp/cache.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.soyreinaldo.com/api/cron/refresh-sports-cache") || code=000
          echo "HTTP $code · $(head -c 600 /tmp/cache.json 2>/dev/null)"

          case "$code" in
            2*) ;;
            *) echo "::error::El refresco de caché falló (HTTP $code)"; exit 1 ;;
          esac
