# Ingesta de marcadores en vivo (quiniela de clubes + Mundial).
#
# El plan gratis de Vercel solo permite crons de una vez al día, así que el
# tick de cada minuto lo daba un cron externo (cron-job.org) que dejó de
# correr al acabar el Mundial. Esto lo sustituye: el repo es público, así que
# los minutos de Actions no cuestan.
#
# GitHub no baja de 5 minutos de granularidad, y encima retrasa los cron de
# schedule cuando hay carga. Por eso cada ejecución da 4 toques espaciados un
# minuto: se cubre casi toda la ventana sin depender de que GitHub sea
# puntual. El endpoint es idempotente y solo llama a API-Football si hay
# partidos en juego (`lq_matches_pending_ingest`), así que los ticks en vacío
# no gastan cuota.
name: Ingesta de marcadores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ingesta-marcadores
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Tocar /api/sports/ingest cada minuto
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta el secreto CRON_SECRET en el repo (gh secret set CRON_SECRET)"
            exit 1
          fi

          fallos=0
          for i in 1 2 3 4; do
            code=$(curl -sS -o /tmp/ingest.json -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://www.soyreinaldo.com/api/sports/ingest") || code=000
            echo "tick $i → HTTP $code · $(head -c 400 /tmp/ingest.json 2>/dev/null)"
            case "$code" in
              2*) ;;
              *) fallos=$((fallos + 1)) ;;
            esac
            [ "$i" -eq 4 ] || sleep 55
          done

          if [ "$fallos" -eq 4 ]; then
            echo "::error::Los 4 toques fallaron — revisa CRON_SECRET o el despliegue"
            exit 1
          fi
          if [ "$fallos" -gt 0 ]; then
            echo "::warning::$fallos de 4 toques fallaron"
          fi
